# Hosting-provider configuration: include inside yiedie.com's HTTPS VirtualHost.
# Requires Apache 2.4.47+ with mod_proxy, mod_proxy_http and mod_ssl.
# These directives do not belong in public_html/.htaccess.
# Keep the existing DocumentRoot and frontend routing.

ProxyRequests Off
ProxyPreserveHost Off
SSLProxyEngine On
SSLProxyVerify require
SSLProxyCheckPeerName On
SSLProxyCheckPeerExpire On

# REQUIRED: configure SSLProxyCACertificateFile here using this server's
# trusted system CA bundle, unless already inherited from the server config.
# Debian/Ubuntu example:
# SSLProxyCACertificateFile /etc/ssl/certs/ca-certificates.crt
# AlmaLinux/Rocky example:
# SSLProxyCACertificateFile /etc/pki/tls/certs/ca-bundle.crt

ProxyPass        "/api/" "https://altbittek.com/api/"
ProxyPassReverse "/api/" "https://altbittek.com/api/"

# Keep realtime chat and calls on the same browser session as HTTP requests.
ProxyPass        "/socket.io/" "https://altbittek.com/socket.io/" upgrade=websocket timeout=600
ProxyPassReverse "/socket.io/" "https://altbittek.com/socket.io/"

ProxyPass        "/uploads/" "https://altbittek.com/uploads/"
ProxyPassReverse "/uploads/" "https://altbittek.com/uploads/"

# The current backend uses host-only cookies, which already work through this
# proxy. Also handle an explicit backend cookie Domain if one is added later.
ProxyPassReverseCookieDomain "altbittek.com" "yiedie.com"
